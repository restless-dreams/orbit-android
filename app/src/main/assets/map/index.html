<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orbit</title>
<style>
  /* The app's font (res/font), so maps read like the app around them. */
  @font-face {
    font-family: 'Google Sans Flex';
    src: url('/res/font/google_sans_flex.ttf') format('truetype');
    font-weight: 300 800;
    font-stretch: 75% 100%;
    font-display: block;
  }

  /* Orbit's sans text in every style; blueprint keeps its monospace and ink its serif. */
  :root {
    --orbit-sans-font: 'Google Sans Flex', system-ui, sans-serif;
  }

  html,
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: transparent;
  }

  /* An app, not a page: nothing to select, no callouts, no tap flashes. */
  body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #map {
    position: fixed;
    inset: 0;
  }
</style>
</head>
<body>
<div id="map"></div>
<script type="module" src="bridge.js"></script>
</body>
</html>
