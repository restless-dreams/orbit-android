:#333333;}#orbit-diagram .arrowheadPath{fill:#333333;}#orbit-diagram .edgePath .path{stroke:#333333;stroke-width:2.0px;}#orbit-diagram .flowchart-link{stroke:#333333;fill:none;}#orbit-diagram .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#orbit-diagram .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#orbit-diagram .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#orbit-diagram .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#orbit-diagram .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#orbit-diagram .cluster text{fill:#333;}#orbit-diagram .cluster span{color:#333;}#orbit-diagram div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#orbit-diagram .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#orbit-diagram rect.text{fill:none;stroke-width:0;}#orbit-diagram .icon-shape,#orbit-diagram .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#orbit-diagram .icon-shape p,#orbit-diagram .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#orbit-diagram .icon-shape rect,#orbit-diagram .image-shape rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#orbit-diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="orbit-diagram_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="orbit-diagram_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse"