name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    # The unit tests and lint for both builds, with the screens compared with their pictures, and the Kotlin code style
    # and its rules' own tests (CONTRIBUTING.md, "Before a pull request").
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android's platform and build tools 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testLibreDebugUnitTest verifyRoborazziLibreDebug testPlayDebugUnitTest lintLibreDebug lintPlayDebug ktlintCheck :code-style:test
      # What the smoke job runs on its emulator besides the release builds: the debug build, its device tests
      # (app/src/androidTest) and the journeys (journeys/), all compiled already by the checks above.
      - run: ./gradlew assembleLibreDebug assembleLibreDebugAndroidTest :journeys:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: device-tests
          path: |
            app/build/outputs/apk/libre/debug/app-libre-debug.apk
            app/build/outputs/apk/androidTest/libre/debug/app-libre-debug-androidTest.apk
            journeys/build/outputs/apk/debug/journeys-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports
            app/build/outputs/roborazzi
            code-style/build/reports

  release:
    # Both minified release builds, with Google Play's bundle: R8 errors and release-only lint errors fail here.
    # A job of its own, beside app's checks: in one Gradle run with them, its Kotlin compiler ran out of memory.
    # Without the upload key, the builds are left unsigned. The smoke job runs both, and the oldest job the libre one.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android's platform and build tools 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleLibreRelease assemblePlayRelease bundlePlayRelease
      - uses: actions/upload-artifact@v4
        with:
          name: libre-release
          path: app/build/outputs/apk/libre/release/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: play-release
          path: app/build/outputs/apk/play/release/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-reports
          path: app/build/reports

  smoke:
    # The minified builds, run as a phone runs them (scripts/smoke-test.sh), on one emulator with Google Play services:
    # each installed, started cold, the welcome map opened until its page draws, started cold again, and the journeys
    # (journeys/): an idea added, edited, found and there after a restart, a panel open as the phone turns, files and
    # text from another app, Quick Settings, and a map's and a private map's screens brought back after Android stopped
    # Orbit. R8 can break a library at run time while every other check passes (AGENTS.md, "Test the release build"),
    # and the play build starts Google Cast where Play services are. Then the device tests on the debug build
    # (scripts/device-tests.sh): a map on the device's own WebView, edited and saved, a page that doesn't load, a page
    # whose process dies, a job that never ends, and process death. Nothing in the crash log, each time.
    needs: [app, release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libre-release
          path: release/libre
      - uses: actions/download-artifact@v4
        with:
          name: play-release
          path: release/play
      - uses: actions/download-artifact@v4
        with:
          name: device-tests
          path: device-tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          {
            echo "LIBRE=$(ls release/libre/*.apk)"
            echo "PLAY=$(ls release/play/*.apk)"
            echo "DEBUG=$(find device-tests -name app-libre-debug.apk)"
            echo "TESTS=$(find device-tests -name app-libre-debug-androidTest.apk)"
            echo "JOURNEYS=$(find device-tests -name journeys-debug.apk)"
          } >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            scripts/smoke-test.sh "$LIBRE" smoke/libre "$JOURNEYS"
            scripts/smoke-test.sh "$PLAY" smoke/play "$JOURNEYS"
            scripts/device-tests.sh "$DEBUG" "$TESTS" "$JOURNEYS" smoke/device
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke

  oldest:
    # Android 10 (API 29), the oldest Orbit supports, with the minified libre build: first with the WebView its image
    # came with, Chromium 74, too old to draw maps, where Orbit has to say so instead; then with Chromium 101, the
    # closest above Orbit's minimum (99) that Android's open-source project shipped for it, installed as an update of the
    # device's own (scripts/aosp-webview.sh): the smoke test and the journeys.
    needs: [app, release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libre-release
          path: release/libre
      - uses: actions/download-artifact@v4
        with:
          name: device-tests
          path: device-tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: .aosp-webview
          key: aosp-webview-${{ hashFiles('scripts/aosp-webview.sh') }}
      - name: Chromium 101's WebView, for Android 10
        run: |
          if [ ! -f .aosp-webview/webview.apk ]; then
            scripts/aosp-webview.sh .aosp-webview/webview.apk
          fi
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          {
            echo "LIBRE=$(ls release/libre/*.apk)"
            echo "JOURNEYS=$(find device-tests -name journeys-debug.apk)"
          } >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            scripts/smoke-test.sh "$LIBRE" oldest/stock-webview
            SMOKE_WEBVIEW=.aosp-webview/webview.apk scripts/smoke-test.sh "$LIBRE" oldest/chromium-101 "$JOURNEYS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oldest
          path: oldest

  pages:
    # The map's pages in web/, against the Orbit they were built with (the commit in
    # app/src/main/assets/map/orbit.json): their tests, types and code style, and a check that
    # the committed pages, and the protocol's examples the app's tests read, are exactly what
    # the source builds, in JavaScript WebViews from Chromium 99 on read.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out that Orbit
        run: |
          commit=$(jq -r .commit app/src/main/assets/map/orbit.json)
          # Orbit keeps its pictures and screenshots in Git LFS, which building it doesn't need. A partial clone brings
          # every commit but no files, so the short commit resolves, and checking it out fetches only that commit's files.
          GIT_LFS_SKIP_SMUDGE=1 git clone --quiet --filter=blob:none https://github.com/restless-dreams/orbit.git .orbit
          GIT_LFS_SKIP_SMUDGE=1 git -C .orbit -c advice.detachedHead=false checkout --quiet "$commit"
          echo "ORBIT_PATH=$GITHUB_WORKSPACE/.orbit" >> "$GITHUB_ENV"
      # Orbit builds with the Bun its own package.json names, as in its own CI; the pages with theirs.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .orbit/package.json
      - name: Build that Orbit
        working-directory: .orbit
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - name: mise.toml pins the pages' Bun
        run: |
          pinned=$(sed -n 's/^bun = "\(.*\)"$/\1/p' mise.toml)
          if [ "bun@$pinned" != "$(jq -r .packageManager web/package.json)" ]; then
            echo "mise.toml and web/package.json pin different Bun versions: give both the same."
            exit 1
          fi
      - name: The store listings fit the stores
        run: bun scripts/store-listing.ts
      - name: The pages' tests, types and code style
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run typecheck
          bun run lint
      - name: The committed pages and protocol examples are what the source builds
        run: |
          (cd web && bun run build)
          # Every file, and orbit.json but for its commit: the Orbit version and map format the commit it names builds.
          if ! scripts/compare-pages.sh; then
            echo "Rebuild them as CONTRIBUTING.md says, with the Bun in web/package.json, and commit them with orbit.json."
            exit 1
          fi
      # The Cast receiver as it's published (CONTRIBUTING.md, "Casting to TVs"), built with the pages.
      - uses: actions/upload-artifact@v4
        with:
          name: cast-receiver
          path: web/dist/cast-receiver/orbit-cast-receiver.html
          if-no-files-found: error
          retention-days: 30
