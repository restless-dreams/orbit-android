name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    # The unit tests and lint for both builds, the Kotlin code style (CONTRIBUTING.md, "Before a pull request"),
    # and both minified release builds: R8 errors and release-only lint errors fail here. The builds aren't run, so
    # a crash R8 causes in the running app needs a release build tried on a phone (AGENTS.md, "Test the release
    # build"). Without the upload key, they're signed with the debug key.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android's platform and build tools 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testLibreDebugUnitTest testPlayDebugUnitTest lintLibreDebug lintPlayDebug ktlintCheck assembleLibreRelease assemblePlayRelease
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports

  pages:
    # The map's pages in web/, against the Orbit they were built with (the commit in
    # app/src/main/assets/map/orbit.json): their tests and code style, and a check that the
    # committed pages are exactly what the source builds.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - name: Check out and build that Orbit
        run: |
          commit=$(jq -r .commit app/src/main/assets/map/orbit.json)
          # Orbit keeps its pictures and screenshots in Git LFS, which building it doesn't need. A partial clone brings
          # every commit but no files, so the short commit resolves, and checking it out fetches only that commit's files.
          GIT_LFS_SKIP_SMUDGE=1 git clone --quiet --filter=blob:none https://github.com/restless-dreams/orbit.git "$RUNNER_TEMP/orbit"
          GIT_LFS_SKIP_SMUDGE=1 git -C "$RUNNER_TEMP/orbit" -c advice.detachedHead=false checkout --quiet "$commit"
          cd "$RUNNER_TEMP/orbit"
          bun install --frozen-lockfile
          bun run build
          echo "ORBIT_PATH=$RUNNER_TEMP/orbit" >> "$GITHUB_ENV"
      - name: The pages' tests and code style
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun test
          bun run lint
      - name: The committed pages are what the source builds
        run: |
          (cd web && bun run build)
          # orbit.json names the Orbit commit, whose short form can be longer in a bigger clone.
          changes=$(git status --porcelain -- app/src/main/assets/map ':(exclude)app/src/main/assets/map/orbit.json')
          if [ -n "$changes" ]; then
            echo "The committed pages differ from what web/ builds. Rebuild them as CONTRIBUTING.md says, with the Bun in web/package.json, and commit them:"
            echo "$changes"
            exit 1
          fi
